spring.application.name=ApacheGUI

# JSP view resolver (former UrlBasedViewResolver: /WEB-INF/jsp/ + .jsp)
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# File uploads (former CommonsMultipartResolver maxUploadSize=100000000)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Logging (legacy org.apache.log4j calls are bridged to SLF4J/Logback)
logging.level.net.apachegui=INFO
